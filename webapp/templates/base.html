<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal script runner with auto-generated forms and streaming output.">
  <link rel="icon" href="/static/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <title>{% block title %}Scriptorium{% endblock %}</title>
  <script>
    /* Prevent dark-mode flash before Alpine initialises */
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('ui', {
        dark: localStorage.getItem('theme') === 'dark',
        search: '',
        activeCategory: null,
        settingsOpen: false,
        outputsDir: '',
        closeBehavior: 'close',
        _settingsLoaded: false,
        updateAvailable: false,
        updateUrl: '',
        latestVersion: '',
        onboardingOpen: false,
        onboardingStep: 0,

        toggleDark() {
          this.dark = !this.dark;
          localStorage.setItem('theme', this.dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', this.dark);
        },

        async loadSettings() {
          if (this._settingsLoaded) return;
          try {
            var res = await fetch('/api/settings');
            var data = await res.json();
            this.outputsDir = data.outputs_dir || '';
            this.closeBehavior = data.close_behavior || 'close';
            if (data.theme === 'dark' !== this.dark) {
              this.dark = data.theme === 'dark';
              localStorage.setItem('theme', this.dark ? 'dark' : 'light');
              document.documentElement.classList.toggle('dark', this.dark);
            }
            this._settingsLoaded = true;
          } catch (e) { /* use defaults */ }
        },

        async saveSettings() {
          try {
            await fetch('/api/settings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                theme: this.dark ? 'dark' : 'light',
                outputs_dir: this.outputsDir,
                close_behavior: this.closeBehavior
              })
            });
            this.settingsOpen = false;
          } catch (e) { /* silent */ }
        },

        async checkUpdate() {
          try {
            var res = await fetch('/api/update-check');
            var data = await res.json();
            if (data.update_available) {
              this.updateAvailable = true;
              this.latestVersion = data.latest;
              this.updateUrl = data.url;
            }
          } catch (e) { /* silent */ }
        },

        initOnboarding() {
          if (!localStorage.getItem('onboarding_seen')) {
            this.onboardingOpen = true;
          }
        },

        nextOnboarding() {
          if (this.onboardingStep < 2) {
            this.onboardingStep++;
          } else {
            this.finishOnboarding();
          }
        },

        finishOnboarding() {
          localStorage.setItem('onboarding_seen', '1');
          this.onboardingOpen = false;
        },
      });

      Alpine.store('ui').loadSettings();
      Alpine.store('ui').checkUpdate();
      Alpine.store('ui').initOnboarding();
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data>
  <!-- Fixed top navbar -->
  <header class="topnav">
    <a href="/" class="topnav-brand" @click="$store.ui.activeCategory = null">
      <img src="/static/logo.webp" alt="" width="22" height="22" aria-hidden="true">
      <span>Scriptorium</span>
    </a>

    <div class="topnav-search">
      <svg class="topnav-search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="search-input"
             type="search"
             placeholder="Search scripts…"
             x-model="$store.ui.search"
             autocomplete="off"
             spellcheck="false"
             aria-label="Search scripts">
      <span class="search-kbd" aria-hidden="true">⌘ K</span>
    </div>

    <div class="topnav-actions">
      <button class="outputs-btn"
              @click="fetch('/api/open-outputs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({theme: $store.ui.activeCategory || 'default'})
              })"
              aria-label="Open outputs folder">
        <img src="/static/icons/icon-folder.png" class="icon-img" width="18" height="18" alt="" aria-hidden="true">
      </button>
      <button class="dark-toggle"
              @click="$store.ui.toggleDark()"
              :aria-label="$store.ui.dark ? 'Switch to light mode' : 'Switch to dark mode'">
        <img src="/static/icons/icon-day.png" class="icon-img icon-day" width="18" height="18" alt="" aria-hidden="true">
        <img src="/static/icons/icon-night.png" class="icon-img icon-night" width="18" height="18" alt="" aria-hidden="true">
      </button>
      <button class="settings-btn"
              @click="$store.ui.settingsOpen = true"
              aria-label="Open settings">
        <img src="/static/icons/icon-settings.png" class="icon-img" width="18" height="18" alt="" aria-hidden="true">
      </button>
    </div>
  </header>

  <!-- Two-column app body -->
  <div class="app-layout">
    {% include "_sidebar.html" %}
    <main class="main-content">
      <div class="content-wrap">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  {% include "_settings_modal.html" %}
  {% include "_onboarding_modal.html" %}

  <script>
    /* Ctrl+K / Cmd+K focuses the search input */
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        const input = document.getElementById('search-input');
        if (input) { input.focus(); input.select(); }
      }
    });
  </script>
</body>
</html>
