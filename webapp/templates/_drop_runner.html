{# Expanded run panel: a chooser card that grew to fill the pane.

   Used for scripts without a custom TEMPLATE, and for every script when a
   batch is staged (a per-file editor cannot represent N files). Scripts with
   a TEMPLATE and a single file navigate to their own page instead. #}

<div class="runner" x-show="runnerOpen" x-cloak
     x-transition:enter="runner-enter"
     x-transition:enter-start="runner-enter-from"
     x-transition:enter-end="runner-enter-to">

  <div class="runner-bar">
    <button class="runner-back" @click="closeRunner()" :disabled="running">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>
    <button class="runner-close" @click="closeDrop()" :disabled="running" aria-label="Clear selection">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <template x-if="selectedScript">
    <div class="runner-body">
      <div class="runner-head">
        <span class="runner-icon">
          <template x-if="selectedScript.icon">
            <svg class="runner-icon-img" aria-hidden="true" focusable="false">
              <use :href="'#i-' + selectedScript.icon"></use>
            </svg>
          </template>
          <template x-if="!selectedScript.icon">
            {% include "_icon_placeholder.html" %}
          </template>
        </span>
        <div>
          <h1 class="runner-title" x-text="selectedScript.title"></h1>
          <p class="runner-desc" x-text="selectedScript.description"></p>
        </div>
      </div>

      <div class="runner-target">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4.5h4l1.2 1.4h5.8v7H2.5v-8.4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <span x-text="batchCount > 1
              ? batchCount + ' ' + dropCategory + ' files (' + totalSizeLabel + ')'
              : dropFilename + ' (' + totalSizeLabel + ')'"></span>
      </div>

      <form class="runner-form" @submit.prevent="startRun()">
        <template x-for="field in runnerFields" :key="field.dest">
          <div class="field">
            <label class="runner-label" :for="'rf_' + field.dest">
              <span x-text="field.label"></span>
              <span class="req" x-show="field.required">*</span>
              <span class="optional-tag" x-show="!field.required">optional</span>
            </label>

            <template x-if="field.widget === 'select'">
              <select :id="'rf_' + field.dest" x-model="fieldValues[field.dest]" :required="field.required">
                <option value="" x-show="!field.required">— optional —</option>
                <template x-for="c in field.choices" :key="c">
                  <option :value="c" x-text="c"></option>
                </template>
              </select>
            </template>

            <template x-if="field.widget === 'checkbox'">
              <div class="checkbox-row">
                <input type="checkbox" :id="'rf_' + field.dest" x-model="fieldValues[field.dest]">
                <label :for="'rf_' + field.dest" x-text="field.label"></label>
              </div>
            </template>

            <template x-if="field.widget === 'number'">
              <input type="number" step="any" :id="'rf_' + field.dest"
                     x-model="fieldValues[field.dest]"
                     :placeholder="field.default || ''" :required="field.required">
            </template>

            <template x-if="field.widget === 'textarea'">
              <textarea :id="'rf_' + field.dest" rows="3"
                        x-model="fieldValues[field.dest]" :required="field.required"></textarea>
            </template>

            <template x-if="field.widget === 'text'">
              <input type="text" :id="'rf_' + field.dest"
                     x-model="fieldValues[field.dest]"
                     :placeholder="field.default || ''" :required="field.required">
            </template>

            <div class="hint" x-show="field.help" x-text="field.help"></div>
          </div>
        </template>

        <div class="run-controls">
          <button type="submit" class="run-btn" :disabled="running">
            <svg class="run-btn-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 2.5v11l9-5.5z" fill="currentColor"/>
            </svg>
            <span x-text="runLabel()"></span>
          </button>

          {# Stops between files rather than mid-file, so nothing is left
             half-written. Only meaningful for a fan-out. #}
          <button type="button" class="btn btn--secondary"
                  x-show="running && batchTotal > 1" x-cloak
                  @click="stopBatch()" :disabled="batchStopping"
                  x-text="batchStopping ? 'Finishing current file…' : 'Stop after this file'"></button>
        </div>

        <p class="batch-progress" x-show="running && batchTotal > 1" x-cloak
           x-text="'File ' + batchIndex + ' of ' + batchTotal
                   + (batchFailed ? '  ·  ' + batchFailed + ' failed so far' : '')"></p>

        {# Progress within the current file, for the scripts that report it.
           Sits under the batch counter, which tracks the other axis. #}
        <div class="run-progress" x-show="running" x-cloak>
          <div class="status-progress"
               :class="progress !== null ? 'status-progress--determinate' : ''"
               role="progressbar" aria-label="Run progress"
               :aria-valuenow="progress !== null ? Math.round(progress * 100) : null"
               aria-valuemin="0" aria-valuemax="100">
            <span :style="progress !== null ? 'width: ' + (progress * 100) + '%' : ''"></span>
          </div>
          <p class="run-progress-label" x-show="progressLabel" x-cloak x-text="progressLabel"></p>
        </div>
      </form>

      <div class="runner-output" x-show="runLines.length || running">
        <h2>Output</h2>
        <div class="runner-console" x-ref="console">
          <template x-for="(line, i) in runLines" :key="i">
            <div :class="line.cls" x-text="line.text"></div>
          </template>
        </div>
        <div class="run-result" x-show="runResult"
             :class="runOk ? 'run-result--ok' : 'run-result--err'"
             x-text="runResult"></div>
      </div>
    </div>
  </template>
</div>
