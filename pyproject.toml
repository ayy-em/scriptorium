[project]
name = "scriptorium"
version = "0.5.2"
description = "Themed one-off scripts with a future browser UI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rembg[cpu,gpu]>=2.0.76",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pytest>=9.0.3",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "ruff>=0.15.12",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
webapp = "webapp.app:run"

[project.optional-dependencies]
av        = ["ffmpeg-python>=0.2", "Pillow>=11.0"]
downloads = ["yt-dlp>=2024.1.0"]
photo     = ["Pillow>=11.0", "rembg>=2.0"]
sitemaps  = ["requests>=2.32"]
tabular   = ["pandas>=2.2", "openpyxl>=3.1"]
telegram  = [
    "matplotlib>=3.9",
    "weasyprint>=63",
    "jinja2>=3.1",
    "wordcloud>=1.9",
    "emoji>=2.14",
    "ijson>=3.3",
    "networkx>=3.0",
]
web       = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "mangum>=0.19",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
desktop   = ["pywebview>=5.0", "pystray>=0.19", "pillow>=11.0"]
speech = [
    "openai>=1.50",
]
documents = [
    "pypdf>=4.0",
]
gif = [
    "pillow>=11.0",
]

[tool.uv]
package = true

# Transitive pins. Both are upstream problems that only surface on a clean
# resolve — which is what CI does — so they are constrained here rather than
# left to chance. See the v0.5.2 CI failure for the original symptoms.
constraint-dependencies = [
    # pymatting 1.1.14 declares only `numba!=0.49.0`, an unbounded floor, so a
    # resolver may legitimately pick numba 0.53.1 (2021) whose llvmlite 0.36.0
    # cannot build on Python 3.14. 1.1.15 raises the floor to numba>=0.60.0.
    "pymatting>=1.1.15",
    # onnxruntime-gpu 1.28.0 ships its cp314 wheel for win_amd64 only; 1.27.0
    # still has the cp314 manylinux wheel that the Linux build needs.
    "onnxruntime-gpu<1.28",
]

[tool.setuptools.packages.find]
include = ["core*", "scripts*", "webapp*"]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".venv",
    ".cursor",
    ".claude",
    "worktree/",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (whitespace, line breaks)
    "F",    # pyflakes (unused imports/vars)
    "I",    # isort (import sorting)
    "W",    # warning-level style issues
    "N",    # pep8-naming (snake_case, UpperCamelCase)
    "D",    # pydocstyle (docstring formatting)
    "Q",    # quotes
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint rules
    "UP",   # pyupgrade (e.g., modern syntax for 3.12)
    "BLE",  # flake8-bugbear (blind except)
]
ignore = [
    "F841",   # unused variable (common in CDK constructs)
    "D401",   # docstrings styling
    "BLE001", # blind except Exception - acceptable for graceful degradation in type casting
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D101",    # test classes don't need docstrings — method names describe intent
    "D102",    # test methods don't need docstrings
    "D103",    # test functions don't need docstrings
    "PLR2004", # magic value comparisons are fine in assertions
]
"tests/telegram/conftest.py" = [
    "D101",
    "D102",
    "D103",
    "PLR2004",
    "PLR0913", # the synthetic _msg() helper centralizes message construction
    "PLR0915", # build_synthetic_chat is intentionally one long readable script
]
"tests/telegram/test_group_analysis.py" = [
    "PLR0913", # _msg() helper mirrors conftest pattern
]
"scripts/av/to_anim.py" = [
    "PLR0913", # to_anim legitimately needs source, start, end, outputs_dir + 4 optional knobs
]
"scripts/telegram/_group_metrics.py" = [
    "PLR0913", # build_group_analytics takes metadata + messages + sender_lookup + config kwargs
]
"scripts/formats/_utils.py" = [
    "PLR0913", # run_convert takes source + exts + out dir + target ext + fn + optional explicit output
]
"scripts/formats/convert_video.py" = [
    "PLR0913", # convert takes source + format + out dir + quality + no_audio + optional explicit output
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"
